name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build public website
        run: |
          npm install
          npm run build
      - name: Build separate admin portal
        working-directory: admin
        run: |
          npm install
          npm run build
